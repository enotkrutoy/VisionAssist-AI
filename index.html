    <meta name="description" content="Автономная система пространственной ориентации и безопасности VisionAssist AI для незрячих и слабовидящих пользователей со стереозвуком 3D и циферблатной навигацией." />
    <meta property="og:title" content="VisionAssist AI — Система Мультимодальной Ассистивной Ориентации" />
    <meta property="og:description" content="Автономная система пространственной ориентации и безопасности VisionAssist AI для незрячих и слабовидящих пользователей со стереозвуком 3D и циферблатной навигацией." />

    <meta name="theme-color" content="#000000" />
    <script>
      // Suppress Vite HMR WebSocket connection warnings in AI Studio preview iframe
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var msg = (reason && (reason.message || reason)) || '';
        if (typeof msg === 'string' && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('closed without opened') !== -1)) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);

      var origError = console.error;
      console.error = function() {
        var str = arguments && arguments[0] ? String(arguments[0]) : '';
        if (str.indexOf('[vite]') !== -1 || str.indexOf('WebSocket') !== -1 || str.indexOf('websocket') !== -1) {
          return;
        }
        origError.apply(console, arguments);
      };

      var origWarn = console.warn;
      console.warn = function() {
        var str = arguments && arguments[0] ? String(arguments[0]) : '';
        if (str.indexOf('[vite]') !== -1 || str.indexOf('WebSocket') !== -1) {
          return;
        }
        origWarn.apply(console, arguments);
      };
    </script>
